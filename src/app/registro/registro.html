<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <form #f="ngForm" class="card shadow-sm p-4" (ngSubmit)="registrar(f)" novalidate>
      <h3 class="mb-1 text-center">Crear cuenta</h3>
      <p class="text-muted text-center small">Regístrate como cliente para hacer pedidos y ver su seguimiento.</p>

      <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>

      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" class="form-control" required minlength="3"
               [(ngModel)]="datos.nombre" #nombre="ngModel"
               [ngClass]="{ 'is-invalid': nombre.invalid && (nombre.touched || f.submitted) }">
        <div class="invalid-feedback">Ingresa al menos 3 caracteres.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Correo</label>
        <input id="email" name="email" type="email" class="form-control" required email
               [(ngModel)]="datos.email" #email="ngModel"
               [ngClass]="{ 'is-invalid': email.invalid && (email.touched || f.submitted) }">
        <div class="invalid-feedback">Ingresa un correo válido.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="telefono">Teléfono <small class="text-muted">(9 dígitos)</small></label>
        <input id="telefono" name="telefono" class="form-control" required pattern="[0-9]{9}" inputmode="numeric"
               [(ngModel)]="datos.telefono" #telefono="ngModel"
               [ngClass]="{ 'is-invalid': telefono.invalid && (telefono.touched || f.submitted) }">
        <div class="invalid-feedback">Ingresa un teléfono de 9 dígitos.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" required minlength="6"
               [(ngModel)]="datos.password" #password="ngModel"
               [ngClass]="{ 'is-invalid': password.invalid && (password.touched || f.submitted) }">
        <div class="invalid-feedback">Mínimo 6 caracteres.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="confirmar">Confirmar contraseña</label>
        <input id="confirmar" name="confirmar" type="password" class="form-control" required
               [(ngModel)]="datos.confirmar" #confirmar="ngModel"
               [ngClass]="{ 'is-invalid': clavesDistintas || (confirmar.invalid && f.submitted) }">
        <div class="invalid-feedback">Las contraseñas no coinciden.</div>
      </div>

      <button class="btn btn-cafe w-100" type="submit" [disabled]="cargando">
        {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
      <p class="small text-center mt-3 mb-0">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </div>
</div>
