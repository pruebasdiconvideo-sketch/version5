<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <form #f="ngForm" class="card shadow-sm p-4" (ngSubmit)="ingresar(f)" novalidate>
      <h3 class="mb-3 text-center">Iniciar sesión</h3>

      <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>

      <div class="mb-3">
        <label class="form-label" for="email">Correo</label>
        <input id="email" name="email" type="email" class="form-control" required email
               [(ngModel)]="email" #campoEmail="ngModel"
               [ngClass]="{ 'is-invalid': campoEmail.invalid && (campoEmail.touched || f.submitted) }">
        <div class="invalid-feedback">Ingresa un correo válido.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" required minlength="4"
               [(ngModel)]="password" #campoPass="ngModel"
               [ngClass]="{ 'is-invalid': campoPass.invalid && (campoPass.touched || f.submitted) }">
        <div class="invalid-feedback">Mínimo 4 caracteres.</div>
      </div>

      <button class="btn btn-cafe w-100" type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
      <p class="small text-center mt-3 mb-2">¿No tienes cuenta? <a routerLink="/registro">Crear cuenta de cliente</a></p>
      <div class="small text-muted border-top pt-2">
        <div><strong>Administrador:</strong> admin&#64;cafeandino.pe / admin123</div>
        <div><strong>Cliente:</strong> cliente&#64;cafeandino.pe / cliente123</div>
      </div>
    </form>
  </div>
</div>
