<h2 class="titulo-seccion mb-2">Ofertas</h2>
<p class="text-muted mb-4">Promos vigentes en postres y café de la semana.</p>

<div class="row g-4">
  <div class="col-12 col-sm-6 col-lg-3" *ngFor="let p of ofertas">
    <app-producto-card [producto]="p" [mostrarBoton]="true" (agregar)="carrito.agregar($event)" />
  </div>
</div>
<p class="text-muted text-center" *ngIf="ofertas.length === 0">Por ahora no hay ofertas activas.</p>
